<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Model 3D (.glb)</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body {
        margin: 0;
        background-color: #000;
      }
      model-viewer {
        width: 100vw;
        height: 100vh;
        display: block;
      }
    </style>
  </head>
  <body>
    <model-viewer
      src="model.glb"
      alt="Model 3D"
      auto-rotate
      camera-controls
      ar
      shadow-intensity="1"
      exposure="1"
    ></model-viewer>
  </body>
</html>
