<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Zobacz model w AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        background: #000;
        color: white;
        font-family: sans-serif;
        text-align: center;
      }
      model-viewer {
        width: 100vw;
        height: 80vh;
      }
      button {
        padding: 1em 2em;
        margin-top: 1em;
        font-size: 1.2em;
        background: #00bfa5;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Model 3D</h2>

    <model-viewer
      id="viewer"
      src="model.glb"
      alt="Model 3D"
      auto-rotate
      camera-controls
      ar
      ar-modes="scene-viewer webxr quick-look"
      ios-src="model.usdz"
      shadow-intensity="1"
      exposure="1"
    ></model-viewer>

    <button onclick="launchAR()">Zobacz w AR</button>

    <script>
      function launchAR() {
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        const viewer = document.getElementById("viewer");

        if (isIOS) {
          // Otwórz .usdz w Quick Look
          window.location.href = viewer.getAttribute("ios-src");
        } else {
          // Android otwiera natywny Scene Viewer
          viewer.activateAR();
        }
      }
    </script>
  </body>
</html>
